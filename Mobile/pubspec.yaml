name: kos_terpadu
description: Aplikasi manajemen kos terpadu untuk penghuni dan pemilik kos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.0

  # Firebase (Updated for web compatibility)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8

  # Local Storage
  shared_preferences: ^2.2.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Icons
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.18.1
  
  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

